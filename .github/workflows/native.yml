name: Native core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go build ./cmd/ctx
      - name: Test Windows source installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -BinDir "$env:RUNNER_TEMP/ctx/bin" -ConfigDir "$env:RUNNER_TEMP/ctx/config"
          & "$env:RUNNER_TEMP/ctx/bin/ctx.exe" version

  legacy-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/test.sh
