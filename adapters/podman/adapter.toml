api_version = "1"
name = "podman"
kind = "container"
executable = "ctx-podman"
executable_windows = "ctx-podman.ps1"
description = "First-party Podman container provider"
capabilities = "list,validate,run,doctor,build,image_push,image_pull,image_save,image_load,volume_exists,volume_create,volume_export,volume_import"
selector_key = "podman"
commands = "podman"
override_env = "CONTAINER_CONNECTION,CONTAINER_HOST"
