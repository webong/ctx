api_version = "2.0"
name = "safari"
runtime = "browser"
surfaces = "web"
executable = "ctx-safari"
executable_windows = "ctx-safari.ps1"
description = "First-party Safari browser provider"
capabilities = "list,validate,open,doctor,share"
selector_key = "browser"
share_spaces = "browser"
browser_share = "cookie.list,cookie.export,cookie.query,policy.export"
browser_management = "extension.targets,extension.capabilities,extension.convert,extension.prepare,extension.package,extension.sign,extension.stage,extension.install,userscript.prepare,userscript.install,userscript.update,userscript.list,userscript.describe,userscript.enable,userscript.disable,userscript.uninstall,bookmarklet.encode,bookmarklet.decode,bookmarklet.install_page"
browser_query_priority = "90"
