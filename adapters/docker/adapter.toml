api_version = "2.0"
name = "docker"
runtime = "manager"
surfaces = "shell"
executable = "ctx-docker"
executable_windows = "ctx-docker.ps1"
description = "First-party Docker manager provider"
capabilities = "list,observe,validate,run,doctor,build,image_push,image_pull,image_save,image_load,volume_exists,volume_create,volume_export,volume_import"
supports = "container"
selector_key = "docker"
commands = "docker"
override_env = "DOCKER_CONTEXT,DOCKER_HOST"
default_provider = "true"
