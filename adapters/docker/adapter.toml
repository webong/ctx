api_version = "1"
name = "docker"
kind = "container"
executable = "ctx-docker"
executable_windows = "ctx-docker.ps1"
description = "First-party Docker container provider"
capabilities = "list,validate,run,doctor,build,image_push,image_pull,image_save,image_load,volume_exists,volume_create,volume_export,volume_import"
selector_key = "docker"
commands = "docker"
override_env = "DOCKER_CONTEXT,DOCKER_HOST"
default_provider = "true"
