api_version = "2.0"
name = "firefox"
runtime = "browser"
surfaces = "web"
executable = "ctx-firefox"
executable_windows = "ctx-firefox.ps1"
description = "First-party Firefox browser provider"
capabilities = "list,validate,open,doctor,share"
selector_key = "browser"
share_spaces = "browser"
browser_share = "cookie.list,cookie.export,cookie.query,cookie.normalize,cookie.import,policy.export,certificate.list,certificate.export,certificate.import"
browser_management = "extension.targets,extension.capabilities,extension.prepare,extension.package,extension.sign,extension.stage,extension.install,extension.activate,userscript.prepare,userscript.install,userscript.update,userscript.list,userscript.describe,userscript.enable,userscript.disable,userscript.uninstall,userscript.activate,session.targets,session.connect,session.navigate,session.inject,session.replay,bookmarklet.encode,bookmarklet.decode,bookmarklet.install_page"
browser_query_priority = "80"
