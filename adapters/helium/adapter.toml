api_version = "2.0"
name = "helium"
runtime = "browser"
surfaces = "web"
executable = "ctx-helium"
executable_windows = "ctx-helium.ps1"
description = "Helium browser provider"
capabilities = "list,validate,doctor,share"
selector_key = "browser"
share_spaces = "browser"
browser_share = "cookie.list,cookie.export,cookie.query,cookie.import"
browser_management = "extension.targets,extension.capabilities,extension.prepare,extension.package,extension.sign,extension.stage,userscript.prepare,userscript.install,userscript.update,userscript.list,userscript.describe,userscript.enable,userscript.disable,userscript.uninstall,bookmarklet.encode,bookmarklet.decode,bookmarklet.install_page"
browser_query_priority = "180"
browser_query_auto = "false"
