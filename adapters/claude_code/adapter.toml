api_version = "2.0"
name = "claude_code"
runtime = "computer"
surfaces = "shell"
executable = "ctx-claude-code"
executable_windows = "ctx-claude-code.ps1"
description = "Computer-side shim and native hook/plugin bridge for Claude Code"
capabilities = "validate,doctor,run"
computer_commands = "claude"
computer_capabilities = "hook,plugin"
extra_keys = "computer_hook_command"
computer_hook_events = "PreToolUse,PermissionRequest,PostToolUse,UserPromptSubmit,SessionStart,SessionEnd,Stop"
computer_hook_default_events = "PreToolUse,PermissionRequest"
computer_hook_settings_file = ".claude/settings.local.json"
computer_hook_template = "computer-hooks.json"
